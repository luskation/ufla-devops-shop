# Proxy reverso da ufla-devops-shop, instalado pelo scripts/deploy.sh.
# O certificado é autoassinado, gerado pelo deploy.sh e NÃO versionado.

# HTTP: só redireciona para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/loja.pem;
    ssl_certificate_key /etc/nginx/ssl/loja.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # Repasse do cliente real: sem isto a aplicação só veria 127.0.0.1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
